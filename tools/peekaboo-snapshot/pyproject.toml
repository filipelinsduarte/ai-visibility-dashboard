[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peekaboo-snapshot"
version = "0.1.0"
description = "Production-grade data generator for the AI Peekaboo visibility dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "AI Peekaboo" },
]
keywords = ["aipeekaboo", "ai-visibility", "snapshot", "dashboard"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
env = [
    "python-dotenv>=1.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "python-dotenv>=1.0",
]

[project.scripts]
peekaboo-snapshot = "peekaboo_snapshot.cli:main"

[project.urls]
Homepage = "https://www.aipeekaboo.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
peekaboo_snapshot = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
